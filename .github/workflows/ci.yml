name: Build

# TODO: workflow disabled during project rewrite, re-enable triggers when ready
on:
  workflow_dispatch: {}

jobs:
  build:

    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Make Gradle Wrapper executable
      run: chmod +x ./gradlew

    # TODO: project is mid-rewrite, build is intentionally not enforced for now
    # - name: Assemble with Gradle Wrapper
    #   run: ./gradlew clean assemble

